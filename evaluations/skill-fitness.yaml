  - keep_raw_evidence_retrievable
  - distinguish_user_correction_from_model_detected_failure
  - compare_like_for_like_benchmark_cases_across_versions
  - record_cost_only_when_provider_usage_is_available
  - do_not_promote_a_skill_version_on_a_single_successful_run
  - regression_failure_blocks_improvement_claim_until_repaired_or_explicitly_accepted
