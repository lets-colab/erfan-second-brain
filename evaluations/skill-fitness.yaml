version: 1
status: active
principle: measure_before_modifying

purpose: >-
  Track whether production skill versions improve real outcomes. This registry is evidence,
  not a vanity score. A skill may not be labeled improved until representative benchmarks
  and regression checks support that claim.

metrics:
  requirement_coverage: percent_of_critical_requirements_with_direct_pass_evidence
  unsupported_claim_rate: material_unsupported_claims_per_run
  false_completion_rate: completion_claims_later_found_unverified_per_run
  first_pass_rate: runs_passing_without_material_repair
  repair_rate: material_repairs_per_run
  repeatability: benchmark_runs_passing_over_total_runs
  regression_rate: previously_passing_cases_that_fail_after_version_change
  user_correction_rate: material_user_corrections_per_run
  user_acceptance_rate: accepted_runs_over_runs_with_explicit_user_verdict
  usage: provider_tokens_or_cost_when_available

promotion_rule:
  minimum_repeated_runs: 5
  requirements:
    - no_open_critical_regression
    - no_increase_in_false_completion_rate
    - no_unexplained_drop_in_requirement_coverage
    - representative_benchmark_evidence_recorded
    - final_state_verification_evidence_recorded
  note: A lower-cost or faster version may be preferred when quality remains within the accepted threshold.

