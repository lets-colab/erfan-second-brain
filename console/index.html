<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DR.X Console — Erfan Second Brain</title>
    <meta
      name="description"
      content="Live operator console for the DR.X AI OS. Renders the repository's own contract files, separating what exists from what is proven."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="console.css" />
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font: 15px system-ui">
        <p>
          This console renders a generated state document with JavaScript. With scripts disabled,
          read <code>console/state.json</code> directly, or run
          <code>python3 scripts/build_console_state.py</code> to refresh it.
        </p>
      </div>
    </noscript>

    <!-- Generated state. Loaded as a script rather than fetched so the console
         opens directly from the filesystem, where fetching a local JSON file is
         blocked by the browser's origin rules. -->
    <script src="state.js"></script>
    <script src="console.js"></script>
  </body>
</html>
